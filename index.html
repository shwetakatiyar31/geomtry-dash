<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Ultimate</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
        body, html { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Segoe UI', sans-serif; }
        #container { position:relative; width:100%; height:100%; }
        canvas { display:block; width:100%; height:100%; }
        
        /* UI OVERLAYS */
        .screen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
        .hidden { display:none !important; }
        
        h1 { font-size:5vw; color:#00ffff; margin-bottom:20px; font-style:italic; font-weight:900; text-shadow:0 0 15px #00ffff; text-align: center; }
        h2 { font-size:3vw; color:#ff00ff; margin-bottom:20px; text-shadow:0 0 10px #ff00ff; }
        
        /* BUTTONS */
        .btn { background:linear-gradient(135deg,#00ffff,#0088cc); color:#fff; border:none; padding:15px 40px; font-size:20px; font-weight:bold; border-radius:30px; cursor:pointer; margin:10px; box-shadow:0 4px 15px rgba(0,255,255,0.3); transition:transform 0.1s; }
        .btn:hover { transform:scale(1.05); }
        .btn:active { transform:scale(0.95); }
        .btn-daily { background:linear-gradient(135deg,#ffcc00,#ff6600); box-shadow:0 4px 15px rgba(255,165,0,0.4); }
        .btn-danger { background:linear-gradient(135deg,#ff3333,#990000); box-shadow:0 4px 15px rgba(255,50,50,0.4); }
        
        #exit-btn { position:absolute; top:20px; right:20px; z-index:20; background:rgba(255,50,50,0.9); border:2px solid #fff; color:#fff; font-weight:bold; padding:10px 20px; border-radius:12px; cursor:pointer; font-size:14px; }

        /* MENU GRID */
        .menu-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; width:80%; max-width:800px; max-height:50vh; overflow-y:auto; padding:10px; }
        .card { background:rgba(255,255,255,0.05); border:2px solid #444; border-radius:15px; padding:20px; text-align:center; cursor:pointer; color:#fff; transition:all 0.2s; }
        .card:hover { border-color:#00ffff; background:rgba(0,255,255,0.1); transform:translateY(-5px); }

        /* STATS */
        .stats { position:absolute; top:20px; left:20px; display:flex; gap:15px; pointer-events:none; z-index:5; font-weight:bold; font-size:18px; color:white; }
        .stat-box { background:rgba(0,0,0,0.6); padding:8px 16px; border-radius:20px; border:1px solid #555; }
    </style>
</head>
<body>
<div id="container">
    <button id="exit-btn" class="hidden" onclick="exitLevel()">🚪 EXIT LEVEL</button>

    <div class="stats">
        <div class="stat-box" style="color:#ffcc00;">★ <span id="ui-stars">0</span></div>
        <div class="stat-box" style="color:#ff3366;">💀 <span id="ui-attempts">0</span></div>
    </div>

    <!-- MAIN MENU -->
    <div id="scr-main" class="screen">
        <h1>GEOMETRY DASH<br>ULTIMATE</h1>
        <button class="btn" onclick="showScreen('scr-levels')">PLAY MAIN LEVELS</button>
        <button class="btn btn-daily" onclick="startDaily()">⚡ DAILY LEVEL ⚡</button>
    </div>

    <!-- LEVEL SELECT -->
    <div id="scr-levels" class="screen hidden">
        <h2>SELECT LEVEL</h2>
        <div class="menu-grid" id="level-container"></div>
        <button class="btn btn-danger" onclick="showScreen('scr-main')">BACK</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let groundY = window.innerHeight * 0.8;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        groundY = window.innerHeight * 0.8;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- AUDIO SYSTEM ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    // --- GAME STATE ---
    let gameState = "MENU"; 
    let isHolding = false;
    let player = { x: 100, y: 0, vy: 0, size: 36, grounded: true, rotation: 0, mode: 'cube' };
    let activeLevel = { speed: 0, color: '#000', data: [], id: 0 };
    let save = { stars: 0, attempts: 0 };
    let camX = 0;

    // --- LEVELS DATA ---
    const LEVEL_DB = [
        { name: "Stereo Madness", speed: 6.0, color: "#112288", data: [{x:500,t:'spike'},{x:800,t:'block'},{x:1100,t:'p_ship'},{x:1400,t:'spike'},{x:1700,t:'spike'},{x:2000,t:'orb'},{x:2300,t:'p_cube'},{x:2600,t:'spike'}] },
        { name: "Back On Track", speed: 6.5, color: "#440066", data: [{x:500,t:'spike'},{x:700,t:'orb'},{x:900,t:'p_wave'},{x:1300,t:'spike'},{x:1600,t:'p_cube'},{x:1900,t:'spike'}] },
        { name: "Polargeist", speed: 7.0, color: "#005522", data: [{x:400,t:'spike'},{x:600,t:'block'},{x:750,t:'orb'},{x:1000,t:'p_robot'},{x:1300,t:'block'},{x:1600,t:'p_cube'},{x:1900,t:'spike'}] }
    ];

    // --- SCREEN LOGIC ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('exit-btn').classList.add('hidden');
        
        if (id === 'scr-levels') renderLevels();
        if (id === 'scr-main') gameState = "MENU";
        initAudio();
    }

    function renderLevels() {
        const div = document.getElementById('level-container'); 
        div.innerHTML = '';
        LEVEL_DB.forEach((l, i) => {
            let card = document.createElement('div'); 
            card.className = 'card';
            card.innerHTML = `<h3>${l.name}</h3><p style="color:#00ffff;margin-top:5px;">Speed: ${l.speed}x</p>`;
            card.onclick = () => startLevel(i, false); 
            div.appendChild(card);
        });
    }

    function startLevel(idx, isDaily) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('exit-btn').classList.remove('hidden');
        initAudio();

        if (isDaily) {
            // Daily Level Setup
            activeLevel.speed = 6.5;
            activeLevel.color = "#223344";
            activeLevel.data = [{x:500,t:'spike'},{x:800,t:'orb'},{x:1100,t:'p_ship'},{x:1500,t:'spike'},{x:1800,t:'p_wave'},{x:2200,t:'p_cube'},{x:2500,t:'spike'}];
            activeLevel.id = -1; 
        } else {
            // Main Level Setup
            activeLevel.speed = LEVEL_DB[idx].speed;
            activeLevel.color = LEVEL_DB[idx].color;
            activeLevel.data = JSON.parse(JSON.stringify(LEVEL_DB[idx].data));
            activeLevel.id = idx;
        }

        resetPlayer();
        gameState = "PLAY"; 
        playTone(440, 'triangle', 0.2);
        save.attempts++; 
        document.getElementById('ui-attempts').innerText = save.attempts;
    }

    function startDaily() { startLevel(0, true); }
    function exitLevel() { showScreen('scr-main'); }

    function resetPlayer() {
        player.x = 100; 
        player.y = groundY - player.size; 
        player.vy = 0;
        player.grounded = true; 
        player.rotation = 0; 
        player.mode = 'cube';
        camX = 0;
    }

    // --- INPUTS ---
    function inputAction(press) {
        isHolding = press;
        if (!press || gameState !== "PLAY") return;
        initAudio();

        // Cube Jump
        if (player.mode === 'cube' && player.grounded) {
            player.vy = -13; player.grounded = false; playTone(330, 'square', 0.1);
        } 
        // Robot Jump
        else if (player.mode === 'robot' && player.grounded) {
            player.vy = -15; player.grounded = false; playTone(380, 'square', 0.15);
        }

        // Orbs
        activeLevel.data.forEach(o => {
            if (o.t === 'orb' && Math.abs(player.x - o.x) < 60) {
                player.vy = -12; player.grounded = false; playTone(660, 'sine', 0.1);
            }
        });
    }

    window.addEventListener('keydown', (e) => { if(e.code==='Space'||e.code==='ArrowUp'){ inputAction(true); e.preventDefault(); } });
    window.addEventListener('keyup', (e) => { if(e.code==='Space'||e.code==='ArrowUp'){ inputAction(false); } });
    canvas.addEventListener('mousedown', () => inputAction(true));
    canvas.addEventListener('mouseup', () => inputAction(false));
    canvas.addEventListener('touchstart', (e) => { inputAction(true); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', () => inputAction(false));

    // --- GAME LOOP ---
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Background
        ctx.fillStyle = gameState === "PLAY" ? activeLevel.color : "#112233";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameState === "PLAY") {
            // Player Movement
            player.x += activeLevel.speed;
            camX = player.x - 200;

            // Physics
            if (player.mode === 'ship') {
                if (isHolding) player.vy -= 0.6; else player.vy += 0.5;

player.y += player.vy;
player.rotation = player.vy * 0.05;
} else if (player.mode === 'wave') {
player.vy = isHolding ? -activeLevel.speed : activeLevel.speed;
player.y += player.vy;
player.rotation = isHolding ? -0.4 : 0.4;
} else {
player.vy += 0.7; // Gravity
player.y += player.vy;
if (!player.grounded) player.rotation += 0.1;
else player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
}
// Floor & Ceiling
if (player.y >= groundY - player.size) {
player.y = groundY - player.size; player.vy = 0; player.grounded = true;
} else if (player.y <= 0) {
player.y = 0; player.vy = 0;
} else if (player.mode !== 'ship' && player.mode !== 'wave') {
player.grounded = false;
}
// Collisions
let crashed = false;
let endX = activeLevel.data.length > 0 ? activeLevel.data[activeLevel.data.length - 1].x + 600 : 2500;
for (let i = 0; i < activeLevel.data.length; i++) {
let o = activeLevel.data[i];
let oY = o.t === 'block' ? groundY - 40 : groundY - 36;
let oSize = 36;
// Portals
if (o.t.startsWith('p_') && Math.abs(player.x - o.x) < 40) {
if (o.t === 'p_ship') player.mode = 'ship';
if (o.t === 'p_wave') player.mode = 'wave';
if (o.t === 'p_robot') player.mode = 'robot';
if (o.t === 'p_cube') player.mode = 'cube';
}
// Hazards
if (player.x + player.size - 8 > o.x && player.x + 8 < o.x + oSize &&
player.y + player.size - 8 > oY && player.y + 8 < oY + oSize) {
if (o.t === 'spike') crashed = true;
if (o.t === 'block') {
if (player.y + player.size <= oY + 16 && player.vy > 0) {
player.y = oY - player.size;
player.vy = 0;
player.grounded = true;
} else {
crashed = true;
}
}
}
}
if (crashed) {
playTone(150, 'sawtooth', 0.4);
startLevel(activeLevel.id, activeLevel.id === -1);
}
if (player.x >= endX) {
playTone(523, 'triangle', 0.6);
save.stars += 1;
document.getElementById('ui-stars').innerText = save.stars;
showScreen('scr-levels');
}
}
// --- DRAWING ---
// Grid
ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 2;
let sGrid = Math.floor(camX / 40) * 40;
for (let gx = sGrid; gx < sGrid + canvas.width + 40; gx += 40) {
ctx.beginPath(); ctx.moveTo(gx - camX, 0); ctx.lineTo(gx - camX, groundY); ctx.stroke();
}
// Ground
ctx.fillStyle = "#0c1a2d"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 4;
ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
// Objects
if (gameState === "PLAY") {
activeLevel.data.forEach(o => {
let rx = o.x - camX;
if (rx < -50 || rx > canvas.width + 50) return;
if (o.t === 'block') {
ctx.fillStyle = "#334466"; ctx.fillRect(rx, groundY - 40, 40, 40);
ctx.strokeStyle = "#fff"; ctx.strokeRect(rx, groundY - 40, 40, 40);
}
else if (o.t === 'spike') {
ctx.fillStyle = "#ff3333";
ctx.beginPath(); ctx.moveTo(rx, groundY); ctx.lineTo(rx + 20, groundY - 36); ctx.lineTo(rx + 40, groundY); ctx.fill();
ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
}
else if (o.t === 'orb') {
ctx.fillStyle = "#ffcc00";
ctx.beginPath(); ctx.arc(rx + 20, groundY - 60, 14, 0, Math.PI * 2); ctx.fill();
}
else if (o.t.startsWith('p_')) {
ctx.fillStyle = o.t === 'p_ship' ? '#ff00ff' : o.t === 'p_wave' ? '#00ff00' : '#fff';
ctx.globalAlpha = 0.5; ctx.fillRect(rx, 0, 10, groundY); ctx.globalAlpha = 1.0;
}
});
// Player
ctx.save();
ctx.translate(player.x + player.size/2 - camX, player.y + player.size/2);
ctx.rotate(player.rotation);
ctx.fillStyle = player.mode === 'ship' ? '#ff00ff' : player.mode === 'wave' ? '#00ff00' : '#00ffff';
ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
ctx.restore();
// Pct
let endX = activeLevel.data.length > 0 ? activeLevel.data[activeLevel.data.length - 1].x + 600 : 2500;
let pct = Math.min(100, Math.max(0, Math.floor((player.x / endX) * 100)));
ctx.fillStyle = "white"; ctx.font = "bold 20px sans-serif";
ctx.fillText(pct + "%", canvas.width/2 - 15, 50);
}
requestAnimationFrame(loop);
}
loop();
