<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Fullscreen</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body, html { width:100%; height:100%; background:#000; overflow:hidden; font-family:sans-serif; }
        #container { position:relative; width:100%; height:100%; }
        canvas { display:block; width:100%; height:100%; }
        .screen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
        .hidden { display:none !important; }
        h1 { font-size:4vw; color:#00ffff; margin-bottom:20px; font-style:italic; font-weight:900; }
        .btn { background:linear-gradient(135deg,#00ffff,#0088cc); color:#fff; border:none; padding:12px 35px; font-size:18px; font-weight:bold; border-radius:25px; cursor:pointer; margin:8px; box-shadow:0 4px 15px rgba(0,255,255,0.3); }
        .btn:hover { transform:scale(1.05); }
        .btn-danger { background:linear-gradient(135deg,#ff3333,#990000); }
        .stats { position:absolute; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; pointer-events:none; z-index:5; font-weight:bold; font-size:18px; }
        .stat-box { background:rgba(0,0,0,0.6); padding:6px 15px; border-radius:20px; border:1px solid #444; }
        .menu-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; width:80%; max-height:40vh; overflow-y:auto; padding:10px; }
        .card { background:rgba(255,255,255,0.05); border:2px solid #444; border-radius:10px; padding:15px; text-align:center; cursor:pointer; }
        .card:hover { border-color:#00ffff; background:rgba(0,255,255,0.1); }
    </style>
</head>
<body>
<div id="container">
    <div class="stats">
        <div class="stat-box" style="color:#ffcc00;">✨ Stars: <span id="ui-stars">0</span></div>
        <div class="stat-box" style="color:#ff3366;">💀 Attempts: <span id="ui-attempts">0</span></div>
    </div>

    <!-- MAIN MENU -->
    <div id="scr-main" class="screen">
        <h1>GEOMETRY DASH ULTIMATE</h1>
        <button class="btn" onclick="showScreen('scr-levels')">PLAY GAME</button>
    </div>

    <!-- LEVEL MENU -->
    <div id="scr-levels" class="screen hidden">
        <h2 style="margin-bottom:20px; color:#ff00ff;">SELECT LEVEL</h2>
        <div class="menu-grid" id="level-container"></div>
        <button class="btn btn-danger" onclick="showScreen('scr-main')">BACK</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let groundY = window.innerHeight * 0.8;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        groundY = window.innerHeight * 0.8;
    }
    window.addEventListener('resize', resize);
    resize();

    let save = { stars: 0, attempts: 0, progress: {} };
    let gameState = "MENU";
    let curLevel = 0;
    let camX = 0;

    const LEVELS = [
        { name: "Stereo Madness", speed: 5.5, color: "#112288", data: [{x:400,t:'block'},{x:600,t:'spike'},{x:850,t:'spike'},{x:1100,t:'block'},{x:1300,t:'spike'},{x:1600,t:'spike'},{x:1900,t:'block'},{x:2200,t:'spike'}] },
        { name: "Back On Track", speed: 6.0, color: "#440066", data: [{x:450,t:'spike'},{x:700,t:'block'},{x:950,t:'spike'},{x:1200,t:'spike'},{x:1500,t:'block'},{x:1800,t:'spike'},{x:2100,t:'spike'}] },
        { name: "Polargeist", speed: 6.5, color: "#005522", data: [{x:400,t:'spike'},{x:650,t:'block'},{x:900,t:'spike'},{x:1150,t:'spike'},{x:1400,t:'block'},{x:1750,t:'spike'}] }
    ];

    let player = { x: 100, y: 0, vy: 0, size: 36, grounded: true, rotation: 0 };
    let obsList = [];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'scr-levels') renderLevels();
        if(id === 'scr-main') gameState = "MENU";
    }

    function renderLevels() {
        const div = document.getElementById('level-container');
        div.innerHTML = '';
        LEVELS.forEach((l, i) => {
            let p = save.progress[l.name] || 0;
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${l.name}</h3><p style="color:#00ffff;margin-top:5px;">Best: ${p}%</p>`;
            card.onclick = () => startLevel(i);
            div.appendChild(card);
        });
    }

    function startLevel(idx) {
        curLevel = idx;
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        obsList = JSON.parse(JSON.stringify(LEVELS[idx].data));
        player.x = 100;
        player.y = groundY - player.size;
        player.vy = 0;
        player.grounded = true;
        player.rotation = 0;
        camX = 0;
        save.attempts++;
        document.getElementById('ui-attempts').innerText = save.attempts;
        gameState = "PLAY";
    }

    function jump() {
        if(gameState === "PLAY" && player.grounded) {
            player.vy = -12;
            player.grounded = false;
        }
    }
    window.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'ArrowUp') { jump(); e.preventDefault(); } });
    canvas.addEventListener('mousedown', jump);

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === "PLAY") {
            let lvl = LEVELS[curLevel];
            player.x += lvl.speed;
            player.vy += 0.6; // Gravity
            player.y += player.vy;
            camX = player.x - 200;

            // Ground Limit Check
            if (player.y >= groundY - player.size) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.grounded = true;
                player.rotation = 0;
            } else {
                player.rotation += 0.08;
            }

            // Object Collision Engine
            let endX = obsList.length > 0 ? obsList[obsList.length - 1].x + 500 : 2000;
            let pct = Math.min(100, Math.floor((player.x / endX) * 100));
            save.progress[lvl.name] = Math.max(save.progress[lvl.name] || 0, pct);

            for (let i = 0; i < obsList.length; i++) {
                let o = obsList[i];
                let oY = o.t === 'block' ? groundY - 40 : groundY - 36;
                
                // Tight AABB Inner-Bounding Overlap Calculation 
                if (player.x + player.size > o.x + 4 && player.x < o.x + 36 &&
                    player.y + player.size > oY + 4 && player.y < oY + 36) {
                    
                    if (o.t === 'spike') {
                        startLevel(curLevel); // Crash reset safely
                        return requestAnimationFrame(loop);
                    }
                    if (o.t === 'block') {
                        if (player.y + player.size <= oY + 14 && player.vy >= 0) {
                            player.y = oY - player.size;
                            player.vy = 0;
                            player.grounded = true;
                        } else {
                            startLevel(curLevel);
                            return requestAnimationFrame(loop);
                        }
                    }
                }
            }

            // Win evaluation loop
            if (player.x >= endX) {
                save.stars += 5;
                document.getElementById('ui-stars').innerText = save.stars;
                showScreen('scr-levels');
            }
        }

        // DRAW BACKDROP
        ctx.fillStyle = gameState === "PLAY" ? LEVELS[curLevel].color : "#112233";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // DRAW DESIGN GRID
        ctx.strokeStyle = "rgba(255,255,255,0.03)";
        let sGrid = Math.floor(camX / 40) * 40;
        for(let gx=sGrid; gx < sGrid + canvas.width + 40; gx += 40) {
            ctx.beginPath(); ctx.moveTo(gx - camX, 0); ctx.lineTo(gx - camX, groundY); ctx.stroke();
        }

        // DRAW GROUND LINE Anchor Mesh
        ctx.fillStyle = "#0c1a2d";
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

        // DRAW BLOCKS & SPIKES RENDER PLACEMENT
        if (gameState === "PLAY") {
            obsList.forEach(o => {
                let rx = o.x - camX;
                if(o.t === 'block') {
                    ctx.fillStyle = "#334466"; ctx.fillRect(rx, groundY - 40, 40, 40);
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(rx, groundY - 40, 40, 40);
                }
                if(o.t === 'spike') {
                    ctx.fillStyle = "#ff3333"; ctx.beginPath();
                    ctx.moveTo(rx, groundY); ctx.lineTo(rx + 20, groundY - 36); ctx.lineTo(rx + 40, groundY);
                    ctx.closePath(); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.stroke();
                }
            });

            // DRAW PLAYER RECTANGLE MATRIX
            ctx.save();
            ctx.translate(player.x + player.size/2 - camX, player.y + player.size/2);
            ctx.rotate(player.rotation);
            ctx.fillStyle = "#00ffff"; ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
            ctx.restore();

            // PROGRESS TEXT HUD
            let endX = obsList.length > 0 ? obsList[obsList.length - 1].x + 500 : 2000;
            let pct = Math.min(100, Math.floor((player.x / endX) * 100));
            ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif";
            ctx.fillText(`${pct}%`, canvas.width/2 - 20, 50);
        }

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
